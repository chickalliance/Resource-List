<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chickasha Community Resources</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #356854;
      --accent-dark: #284e3f;
      --chip: #e8f0ec;
      --warning-bg: #fff7ed;
      --warning-text: #9a3412;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo {
      display: block;
      margin: 0 auto 16px;
      max-width: 220px;
      width: 100%;
      height: auto;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(244,244,244,0.96);
      backdrop-filter: blur(6px);
      padding: 8px 0 14px;
      margin-bottom: 8px;
    }

    .search {
      width: 100%;
      max-width: 460px;
      padding: 12px 14px;
      font-size: 16px;
      margin: 0 auto 14px;
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .status-row {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .agency-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .agency-card {
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #ececec;
    }

    .agency-name {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--accent-dark);
    }

    .line {
      margin: 6px 0;
      line-height: 1.45;
      word-break: break-word;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .chip {
      background: var(--chip);
      color: var(--accent-dark);
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 999px;
    }

    .warning {
      margin-top: 12px;
      background: var(--warning-bg);
      color: var(--warning-text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      background: white;
      border-radius: 14px;
      padding: 30px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: none;
    }

    a {
      color: #0645AD;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      body { padding: 14px; }
      h1 { font-size: 1.6rem; }
      .filter-btn { font-size: 13px; padding: 8px 10px; }
      .agency-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="CCALogo.png" alt="Chickasha Community Alliance Logo" class="logo" />
    <h1>Chickasha Community Resource List</h1>
    <div class="subtitle">Live directory powered by your Google Sheet</div>

    <div class="controls">
      <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Search agencies, services, categories, or contact info..."
      />
      <div id="filterBar" class="filter-bar"></div>
      <div id="statusRow" class="status-row">Loading resources...</div>
    </div>

    <div id="agencyList" class="agency-list"></div>
    <div id="emptyState" class="empty">No agencies match that search/filter right now.</div>
  </div>

  <script>
    const API_URL = "https://sheetdb.io/api/v1/8iopamglxgc0m";

    const categoryOrder = [
      "Food Assistance",
      "Utility Assistance",
      "Housing",
      "Clothing",
      "Public Meals",
      "Hygiene / Showers",
      "Counseling / Mental Health",
      "Medical / Health",
      "Education / Testing",
      "Legal",
      "Transportation",
      "Church Services",
      "Faith-Based Support",
      "Recovery",
      "Mobile Resource"
    ];

    let agencies = [];
    let activeCategory = "All";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function makeClickable(text) {
      const safe = escapeHtml(text || "");
      return safe.replace(/(https?:\/\/[^\s,]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function parseCategories(value) {
      return String(value || "")
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);
    }

    function normalize(value) {
      return String(value || "").toLowerCase();
    }

    function buildFilterButtons() {
      const bar = document.getElementById("filterBar");
      const categorySet = new Set();

      agencies.forEach(row => {
        parseCategories(row["Categories"]).forEach(cat => categorySet.add(cat));
      });

      const discovered = Array.from(categorySet);
      const ordered = [
        "All",
        ...categoryOrder.filter(cat => discovered.includes(cat)),
        ...discovered.filter(cat => !categoryOrder.includes(cat)).sort()
      ];

      bar.innerHTML = "";

      ordered.forEach(category => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (category === activeCategory ? " active" : "");
        btn.textContent = category;
        btn.type = "button";
        btn.addEventListener("click", () => {
          activeCategory = category;
          [...document.querySelectorAll(".filter-btn")].forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderAgencies();
        });
        bar.appendChild(btn);
      });
    }

    function getFilteredAgencies() {
      const search = normalize(document.getElementById("searchInput").value);

      return agencies.filter(row => {
        const categories = parseCategories(row["Categories"]);
        const matchesCategory = activeCategory === "All" || categories.includes(activeCategory);

        const haystack = [
          row["Name of Agency"],
          row["Contact Info"],
          row["Services"],
          row["Hours"],
          row["Categories"],
          row["Availability"]
        ].map(normalize).join(" ");

        const matchesSearch = haystack.includes(search);
        return matchesCategory && matchesSearch;
      });
    }

    function renderAgencies() {
      const list = document.getElementById("agencyList");
      const empty = document.getElementById("emptyState");
      const status = document.getElementById("statusRow");
      const filtered = getFilteredAgencies();

      list.innerHTML = "";

      if (!filtered.length) {
        empty.style.display = "block";
        status.textContent = "0 resources shown";
        return;
      }

      empty.style.display = "none";
      status.textContent = `${filtered.length} resource${filtered.length === 1 ? "" : "s"} shown`;

      filtered.forEach(row => {
        const categories = parseCategories(row["Categories"]);
        const availability = String(row["Availability"] || "").trim();

        const card = document.createElement("div");
        card.className = "agency-card";

        const chips = categories.length
          ? `<div class="chips">${categories.map(cat => `<span class="chip">${escapeHtml(cat)}</span>`).join("")}</div>`
          : "";

        const warning = availability
          ? `<div class="warning">⚠️ ${escapeHtml(availability)}</div>`
          : "";

        card.innerHTML = `
          <div class="agency-name">${escapeHtml(row["Name of Agency"] || "Unnamed Agency")}</div>
          <div class="line">📞 ${makeClickable(row["Contact Info"] || "N/A")}</div>
          <div class="line">📝 ${escapeHtml(row["Services"] || "N/A")}</div>
          <div class="line">⏰ ${escapeHtml(row["Hours"] || "N/A")}</div>
          ${chips}
          ${warning}
        `;

        list.appendChild(card);
      });
    }

    async function fetchAgencies() {
      const status = document.getElementById("statusRow");
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        agencies = await res.json();
        buildFilterButtons();
        renderAgencies();
      } catch (error) {
        console.error(error);
        status.textContent = "Sorry, the resource list could not be loaded right now.";
        document.getElementById("agencyList").innerHTML = "";
        document.getElementById("emptyState").style.display = "none";
      }
    }

    document.getElementById("searchInput").addEventListener("input", renderAgencies);
    window.addEventListener("DOMContentLoaded", fetchAgencies);
  </script>
</body>
</html>
